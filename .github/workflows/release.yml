name: Release

# On a tag vX.Y.Z: build the jar and draft a GitHub release with SHA256SUMS
# and the notes from CHANGELOG.md. A pull request that changes this file, the
# notes or the build builds the jar without a draft. See CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", ".github/notizen.sh", "CHANGELOG.md", "build.gradle.kts", "gradle.properties"]

# Only the job that drafts the release may write.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  jar:
    name: Jar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The version lives in gradle.properties; a tag has to name it. The notes
      # right here: without a section in CHANGELOG.md the run fails before building.
      - name: Version and notes
        run: |
          version=$(sed -n 's/^version=\([^[:space:]]*\).*/\1/p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::gradle.properties names no version like 1.2.3: $version"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash .github/notizen.sh "$version"

      - name: Build and test
        timeout-minutes: 20
        run: ./gradlew build --console=plain

      # The jar names the same version in fabric.mod.json and carries LICENSE and NOTICE in META-INF.
      - name: Check
        run: |
          jar=build/libs/ColorfulLeaves-$VERSION.jar
          test -f "$jar" || { echo "::error::$jar is missing"; exit 1; }
          test "$(unzip -p "$jar" fabric.mod.json | jq -r .version)" = "$VERSION" \
            || { echo "::error::fabric.mod.json in $jar does not name version $VERSION"; exit 1; }
          for datei in LICENSE NOTICE; do
            unzip -Z1 "$jar" | grep -qx "META-INF/$datei" || { echo "::error::$jar carries no META-INF/$datei"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/ColorfulLeaves-${{ env.VERSION }}.jar
          if-no-files-found: error

  release:
    name: Release draft
    needs: jar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Checksums
        run: |
          test "$(ls dist/*.jar | wc -l)" -eq 1 || { echo "::error::expected exactly one jar"; exit 1; }
          cd dist && sha256sum *.jar > SHA256SUMS && cat SHA256SUMS

      # Only a draft: publishing is done by hand; only the published release goes to Modrinth.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/notizen.sh "${GITHUB_REF_NAME#v}" > notizen.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file notizen.md dist/*.jar dist/SHA256SUMS
